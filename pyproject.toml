[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshforge"
version = "0.2.0"
requires-python = ">=3.11"
description = "Professional CAE meshing: STEP → C3D10 tet mesh → quality → Abaqus .inp"

[project.scripts]
meshforge = "meshforge.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meshforge*"]
